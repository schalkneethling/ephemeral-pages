[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"

[[redirects]]
from = "/mcp"
to = "/.netlify/functions/mcp"
status = 200

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/pages/:splat"
status = 200
force = true

[[redirects]]
from = "/p/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin"
to = "/index.html"
status = 200
