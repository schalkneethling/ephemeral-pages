name: Staging recovery

on:
  workflow_dispatch:
    inputs:
      source_rehearsal_run_id:
        description: Successful staging rehearsal B diagnostics run to recover from
        required: true
        type: string
      target_rehearsal_run_id:
        description: Successful staging rehearsal A diagnostics run to restore
        required: true
        type: string
      resume_recovery_run_id:
        description: Latest interrupted staging recovery run; empty for a fresh recovery
        required: false
        type: string

permissions:
  actions: read
  contents: read
  # Recovery smoke uses GitHub OIDC for the staging upload check.
  id-token: write

concurrency:
  group: release-rehearsal
  cancel-in-progress: false
  queue: max

jobs:
  recovery:
    name: Staging recovery
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      RECOVERY_WORKSPACE: /tmp/release-staging-recovery-${{ github.run_id }}
    steps:
      - name: Check out the trusted staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install release dependencies
        run: bun install --frozen-lockfile

      - name: Verify staging recovery evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RECOVERY_RUN_ID: ${{ inputs.resume_recovery_run_id }}
          SOURCE_REHEARSAL_RUN_ID: ${{ inputs.source_rehearsal_run_id }}
          TARGET_REHEARSAL_RUN_ID: ${{ inputs.target_rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_args=(
            --source-rehearsal-run-id "$SOURCE_REHEARSAL_RUN_ID"
            --target-rehearsal-run-id "$TARGET_REHEARSAL_RUN_ID"
            --workspace "$RECOVERY_WORKSPACE"
          )
          if test -n "$RESUME_RECOVERY_RUN_ID"; then
            recovery_args+=(--resume-recovery-run-id "$RESUME_RECOVERY_RUN_ID")
          fi
          bun scripts/release/staging-recovery-cli.ts preflight "${recovery_args[@]}"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Restore verified staging pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RESUME_RECOVERY_RUN_ID: ${{ inputs.resume_recovery_run_id }}
          SOURCE_REHEARSAL_RUN_ID: ${{ inputs.source_rehearsal_run_id }}
          TARGET_REHEARSAL_RUN_ID: ${{ inputs.target_rehearsal_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_args=(
            --source-rehearsal-run-id "$SOURCE_REHEARSAL_RUN_ID"
            --target-rehearsal-run-id "$TARGET_REHEARSAL_RUN_ID"
            --workspace "$RECOVERY_WORKSPACE"
          )
          if test -n "$RESUME_RECOVERY_RUN_ID"; then
            recovery_args+=(--resume-recovery-run-id "$RESUME_RECOVERY_RUN_ID")
          fi
          bun scripts/release/staging-recovery-cli.ts execute "${recovery_args[@]}"

      - name: Retain staging recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-staging-recovery
          path: ${{ env.RECOVERY_WORKSPACE }}
          if-no-files-found: warn
          retention-days: 7
