name: Collaboration governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  program-gate:
    name: Collaboration program gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enforce issue scope, dependencies, and evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-collaboration-pr.mjs
