name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install isolated Cloudflare test runner
        working-directory: collaboration-worker
        run: bun install --frozen-lockfile

      - name: Check application
        run: bunx vp check

      - name: Test application
        run: bunx vp test

      - name: Check and dry-run the collaboration Worker
        run: |
          bun run collaboration:check
          bun run collaboration:deploy:dry

      - name: Test the Durable Object runtime
        working-directory: collaboration-worker
        run: bunx vitest run --config vitest.config.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test browser flows
        run: bun run test:e2e
