name: Staging release rehearsal

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # runCollaborationSmoke requests GitHub OIDC for the staging upload check.
  id-token: write

concurrency:
  group: release-rehearsal
  cancel-in-progress: false
  queue: max

jobs:
  rehearsal:
    name: Staging release rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      RELEASE_WORKSPACE: /tmp/release-rehearsal-${{ github.run_id }}
    steps:
      - name: Check out the trusted staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install release dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Rehearse the staging release and issue approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >-
          bun scripts/release/rehearsal-workflow-cli.ts
          --workspace "$RELEASE_WORKSPACE"
          --confirm-external-smoke
          --capture

      - name: Retain reviewed rehearsal approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal
          path: ${{ env.RELEASE_WORKSPACE }}/approval
          if-no-files-found: error
          retention-days: 7

      - name: Retain sanitized rehearsal diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-diagnostics
          path: |
            ${{ env.RELEASE_WORKSPACE }}/artifacts
            ${{ env.RELEASE_WORKSPACE }}/reports
          if-no-files-found: warn
          retention-days: 7
